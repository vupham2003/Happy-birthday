<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@500;700&family=Quicksand:wght@500;700&family=Caveat:wght@600;700&family=Be+Vietnam+Pro:wght@400;500&family=Dancing+Script:wght@600&display=swap">
<style>
:root{--bg1:#f4f1fb;--bg2:#fbe6ef;--card:rgba(255,255,255,.72);--ink:#5b2a45;--muted:#8a6578;--crimson:#c8264f;--pink:#ff5c8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1426;--bg2:#2a1424;--card:rgba(255,255,255,.08);--ink:#ffe6ef;--muted:#d6a8bd;--crimson:#ff7a9f}}
:root[data-theme="dark"]{--bg1:#1b1426;--bg2:#2a1424;--card:rgba(255,255,255,.08);--ink:#ffe6ef;--muted:#d6a8bd;--crimson:#ff7a9f}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Quicksand",system-ui,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg1));background-attachment:fixed;overflow-x:hidden}
section{max-width:1000px;margin:0 auto;padding:54px 18px;text-align:center;position:relative}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.eyebrow.dot:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#2bb3a3;margin-right:7px}
h2{font-family:"Playfair Display",serif;color:var(--crimson);font-size:clamp(26px,5vw,40px);margin:8px 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 26px}
.hero{padding-top:80px}
.hero h1{font-family:"Pacifico",cursive;font-weight:400;color:var(--crimson);font-size:clamp(34px,8.5vw,80px);line-height:1.2;margin:18px 0 10px;text-shadow:2px 2px 0 rgba(200,38,79,.12)}
.quote{font-family:"Playfair Display",serif;font-style:italic;max-width:560px;margin:0 auto;line-height:1.7;font-size:15px}
.count{margin:36px auto 0;max-width:640px;background:var(--card);border-radius:28px;padding:26px 16px;box-shadow:0 10px 40px rgba(200,38,79,.1)}
.count .eyebrow{color:var(--crimson)}
.cd{display:flex;justify-content:space-around;margin:18px 0 14px}
.cd b{display:block;font-size:clamp(26px,6vw,40px);color:var(--crimson);font-weight:700}
.cd span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.since{font-size:12px;color:var(--muted)}
.bub{position:fixed;z-index:5;width:104px;min-height:54px;padding:8px 10px;border:2px solid var(--ink);border-radius:50%;background:var(--bg1);font:600 13px/1.2 "Caveat",cursive;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:.92}
.bub.l{left:-26px;top:32%;transform:rotate(-8deg)}.bub.r{right:-26px;top:34%;transform:rotate(6deg)}
@media(max-width:640px){.bub{display:none}}
/* cake */
.stage{display:flex;flex-direction:column;align-items:center;margin-top:10px}
.cakebox{cursor:pointer;transition:clip-path .5s;width:min(310px,84vw);filter:drop-shadow(0 14px 18px rgba(200,38,79,.22));animation:cb 3.2s ease-in-out infinite}
.cakebox svg{width:100%;display:block;overflow:visible}
@keyframes cb{50%{transform:translateY(-8px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .28s infinite alternate;transition:opacity .4s}
.out .flame{opacity:0}
@keyframes fl{to{transform:scale(.86,1.12) rotate(5deg)}}
.btn{border:0;border-radius:999px;padding:12px 24px;font:700 15px Quicksand;cursor:pointer;background:linear-gradient(90deg,#ff5c8a,#e63b8f);color:#fff;box-shadow:0 8px 20px rgba(255,92,138,.35)}
.btn.soft{background:rgba(255,255,255,.85);color:var(--ink);box-shadow:none}
.note{color:var(--crimson);font-size:13px;font-weight:700;margin-top:22px;min-height:20px}
.fly{position:fixed;pointer-events:none;z-index:50;font-size:26px;animation:up 1.2s forwards}
@keyframes up{to{transform:translateY(-120px);opacity:0}}
/* modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(80,60,130,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:18px}
.ov.show{display:flex}
.modal{background:linear-gradient(#fff,#f4eefc);color:#5b2a45;border-radius:28px;padding:22px;width:min(380px,100%);text-align:center;position:relative;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.modal .ph{width:62%;aspect-ratio:1;margin:0 auto 16px;border-radius:14px;border:5px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.2);background:#ffd9e4 center/cover;display:flex;align-items:center;justify-content:center;font-size:40px}
.modal h3{font-family:"Playfair Display",serif;color:#c8264f;font-size:24px;margin:0 0 8px}
.modal p{margin:0 0 16px;font-size:14px}
.modal .x{position:absolute;right:14px;top:12px;border:0;background:#eee;width:28px;height:28px;border-radius:50%;cursor:pointer}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* envelope */
.env{width:min(300px,80vw);height:190px;margin:30px auto 10px;position:relative;cursor:pointer;perspective:800px}
.env .back{position:absolute;inset:0;background:#e8486f;border-radius:6px}
.env .paper{position:absolute;left:8%;right:8%;top:8%;height:80%;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font:600 20px Caveat;color:var(--crimson);transition:transform .6s .3s;z-index:2}
.env .front{position:absolute;inset:0;background:#f06a8a;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:#e0577b;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s;z-index:4}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .paper{transform:translateY(-46px)}
.lt{max-height:0;overflow:hidden;opacity:0;transition:all .9s;max-width:560px;margin:0 auto}
.lt.show{max-height:1400px;opacity:1;margin-top:34px}
.lt div{background:#fffdf8;color:#5b2a45;border-radius:14px;padding:26px 24px;text-align:left;white-space:pre-wrap;font-family:"Caveat","Segoe Print","Comic Sans MS",cursive;font-weight:600;font-size:25px;line-height:1.6;box-shadow:0 14px 34px rgba(200,38,79,.15)}
/* polaroid */
.panel{background:var(--card);border-radius:30px;padding:30px 16px 24px;box-shadow:0 10px 40px rgba(200,38,79,.08)}
.pol{background:#fff;padding:9px 9px 8px;border-radius:4px;box-shadow:0 8px 20px rgba(0,0,0,.18);flex:0 0 auto;color:#4a2a3a}
.pol .im{width:100%;aspect-ratio:4/5;background:linear-gradient(135deg,#ffd9e4,#e6dcff) center/cover;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:zoom-in}
.pol p{margin:8px 0 0;font:700 15px Caveat,cursive;letter-spacing:.05em}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.grid4 .pol:nth-child(odd){transform:rotate(-1.5deg)}.grid4 .pol:nth-child(even){transform:rotate(1.5deg)}
.film{position:relative;background:#1c1c1f;border-radius:18px;padding:26px 0;margin-top:6px}
.film:before,.film:after{content:"";position:absolute;left:12px;right:12px;height:10px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 28px);border-radius:3px;opacity:.9}
.film:before{top:9px}.film:after{bottom:9px}
.strip{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .pol{width:min(230px,62vw);scroll-snap-align:start}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:#fff;cursor:pointer;z-index:3;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.arr.a{left:6px}.arr.b{right:6px}
footer{padding:30px 20px 100px;text-align:center;color:var(--muted);font:600 22px Caveat}
.heart{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards;z-index:60}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:90}
#lb img{max-width:94%;max-height:90%;border-radius:8px}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--crimson);color:#fff;font-size:22px;cursor:pointer;z-index:70;box-shadow:0 6px 18px rgba(0,0,0,.3)}
#ed{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:#fff;color:#4a2a3a;z-index:85;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 30px;overflow-y:auto;transform:translateX(105%);transition:.3s;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
#ed.open{transform:none}
#ed h3{font:400 26px Pacifico;color:#c8264f;margin:0 0 4px}
#ed label{display:block;font-weight:700;font-size:12px;margin:12px 0 4px;color:#8a6578}
#ed input[type=text],#ed textarea{width:100%;padding:9px 10px;border-radius:10px;border:1px solid #e5cdd8;font:inherit;font-size:14px;color:#4a2a3a;background:#fff}
#ed textarea{min-height:80px;resize:vertical}
#ed h4{margin:22px 0 4px;color:#c8264f;font-size:15px}
.it{display:flex;gap:8px;align-items:center;margin-top:8px}
.it label.th{margin:0;width:46px;height:46px;border-radius:8px;background:#ffd9e4 center/cover;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-size:18px}
.it input[type=file]{display:none}
.it input[type=text]{flex:1;min-width:0}
.it button{border:0;background:#fde2ea;color:#c8264f;border-radius:8px;width:30px;height:30px;cursor:pointer}
.ed-btn{border:0;border-radius:999px;padding:9px 16px;background:#c8264f;color:#fff;font:700 13px Quicksand;cursor:pointer;margin:10px 6px 0 0}
.ed-btn.g{background:#f3dde6;color:#8a2e4d}
#ed small{color:#8a6578}
</style>
</head>
<body>

mem:[{src:"",cap:"2025"},{src:"",cap:"2024"},{src:"",cap:"2023"},{src:"",cap:"2022"}],
rec:["10/2025","11/2025","12/2025","01/2026","02/2026","03/2026"].map(function(m){return{src:"",cap:"Tháng "+m}})};
var F=[["name","Tên người nhận"],["age","Tuổi (số)"],["eyebrow","Dòng nhỏ trên cùng"],["quote","Câu mở đầu","a"],["countTitle","Tiêu đề đồng hồ"],["startDate","Ngày bắt đầu yêu (YYYY-MM-DD)"],["startPrefix","Chữ trước ngày bắt đầu"],["cakeText","Chữ trên bánh"],["cakeSub","Mô tả phần bánh","a"],["eatTitle","Cửa sổ: tiêu đề"],["eatText","Cửa sổ: nội dung"],["eatBtn1","Nút 1"],["eatBtn2","Nút 2"],["letterEyebrow","Nhãn phần thư"],["letterSub","Mô tả phần thư"],["letterTop","Chữ trên phong bì"],["letter","Nội dung thư","L"],["memTitle","Tiêu đề kỷ niệm"],["memSub","Mô tả kỷ niệm","a"],["recapEyebrow","Nhãn recap"],["recapSub","Mô tả recap","a"],["footer","Chân trang"]];
var S;
function $(i){return document.getElementById(i)}
function load(){try{var r=JSON.parse(localStorage.getItem(KEY)||"{}");if(r.age==22)r.age=23;if(r.cakeText=="HAPPY 22!")r.cakeText="HAPPY 23!";if(r.letterFont=="Caveat")r.letterFont="Playfair Display";S=Object.assign({},DEF,r)}catch(e){S=JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Bộ nhớ đầy, hãy xoá bớt ảnh.")}}
function pol(p,cls){
  var d=document.createElement("div");d.className="pol";
  var im=document.createElement("div");im.className="im";
  if(p.src){im.style.backgroundImage="url("+p.src+")";im.onclick=function(){$("lb").querySelector("img").src=p.src;$("lb").style.display="flex"}}else im.textContent="📷";
  var c=document.createElement("p");c.textContent=p.cap||"";d.appendChild(im);d.appendChild(c);return d;
}
function applyFont(){var f=S.letterFont,el=document.querySelector(".lt div");el.style.fontFamily='"'+f+'",Georgia,serif';el.style.fontSize=(f=="Caveat"||f=="Dancing Script")?"25px":"17px";el.style.lineHeight=(f=="Caveat"||f=="Dancing Script")?"1.6":"1.9";var p=document.querySelector(".env .paper");p.style.fontFamily=el.style.fontFamily;p.style.fontSize=(f=="Caveat"||f=="Dancing Script")?"24px":"18px";p.style.fontWeight="600";$("fontSel").value=f}
function render(){applyFont();
  F.forEach(function(f){document.querySelectorAll('[data-k="'+f[0]+'"]').forEach(function(e){e.textContent=S[f[0]]})});
  var n=S.name,a=S.age;
  $("vTitle").textContent="Happy "+a+(a%10==1&&a!=11?"st":a%10==2&&a!=12?"nd":a%10==3&&a!=13?"rd":"th")+" Birthday "+n+"!";
  document.title="Happy "+a+" Birthday "+n+" 🍓🎂";
  
  $("e2").textContent="02 • Điều ước tuổi "+a;
  $("h2cake").textContent="Chiếc bánh sinh nhật dành riêng cho "+n+" 🍓🎂";
  $("h2letter").textContent="Bức thư tình dành riêng cho "+n+" 💌";
  $("h2recap").textContent="Recap tuổi "+(a-1)+" của "+n+" 🎞️";
  var d=new Date(S.startDate+"T00:00:00");
  $("since").textContent="♥ "+S.startPrefix+" "+(isNaN(d)?"":d.toLocaleDateString("vi-VN"));
  var ph=$("eatPh");ph.style.backgroundImage=S.eatPhoto?"url("+S.eatPhoto+")":"";ph.textContent=S.eatPhoto?"":"🧸";
  $("eatTh").style.backgroundImage=S.eatPhoto?"url("+S.eatPhoto+")":"";
  var m=$("mem");m.innerHTML="";S.mem.forEach(function(p){m.appendChild(pol(p))});
  var r=$("rec");r.innerHTML="";S.rec.forEach(function(p){r.appendChild(pol(p))});
}
function tick(){
  var d=new Date(S.startDate+"T00:00:00"),t=Math.max(0,Math.floor((Date.now()-d)/1000));
  $("cdD").textContent=Math.floor(t/86400).toLocaleString("vi-VN");$("cdH").textContent=Math.floor(t%86400/3600);
  $("cdM").textContent=Math.floor(t%3600/60);$("cdS").textContent=t%60;
}
setInterval(tick,1000);
function sc(k){var s=$("rec");s.scrollBy({left:k*(s.clientWidth*.7),behavior:"smooth"})}
/* cake */
var blown=false,bites=0;
$("blow").onclick=function(){if(blown)return;blown=true;$("cake").classList.add("out");$("cakeNote").textContent="Nến tắt rồi! Bây giờ bấm vào chiếc bánh để cắn từng miếng ✨";this.style.display="none";heart(14)};
$("cake").onclick=function(e){
  if(!blown){$("cakeNote").textContent="Thổi nến trước đã nha! 🕯️";return}
  if(bites>=5)return;bites++;
  this.style.clipPath="inset(0 0 0 "+bites*19+"%)";
  var f=document.createElement("div");f.className="fly";f.textContent=["🍓","🍰","🧁","💖","🥰"][bites-1];f.style.left=e.clientX+"px";f.style.top=e.clientY+"px";document.body.appendChild(f);setTimeout(function(){f.remove()},1200);
  $("cakeNote").textContent=bites<5?"Nom nom... còn "+(5-bites)+" miếng nữa 🍰":"";
  if(bites>=5)setTimeout(function(){$("ov").classList.add("show")},600);
};
function closeM(){$("ov").classList.remove("show")}
function yes(){heart(30);closeM();$("cakeNote").textContent="Hihi 💗 Yêu em nhiều!"}
$("env").onclick=function(){this.classList.toggle("open");$("lt").classList.toggle("show");$("envHint").style.display="none"};
function heart(n){var em=["💖","🎀","🍓","🌸","🧸","✨"];for(var i=0;i<n;i++)(function(i){setTimeout(function(){var h=document.createElement("div");h.className="heart";h.textContent=em[i%6];h.style.left=Math.random()*100+"vw";h.style.fontSize=(18+Math.random()*24)+"px";h.style.animationDuration=(3+Math.random()*3)+"s";document.body.appendChild(h);setTimeout(function(){h.remove()},6500)},i*70)})(i)}
/* editor */
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=720,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.readAsDataURL(file)}
function buildForm(){
  var b=$("edF");b.innerHTML="";
  F.forEach(function(f){
    var l=document.createElement("label");l.textContent=f[1];
    var i=document.createElement(f[2]?"textarea":"input");if(!f[2])i.type="text";if(f[2]=="L")i.style.minHeight="170px";
    i.value=S[f[0]];i.oninput=function(){S[f[0]]=f[0]=="age"?(parseInt(i.value)||1):i.value;save();render()};
    b.appendChild(l);b.appendChild(i);
  });
}
function buildList(key,boxId){
  var box=$(boxId);box.innerHTML="";
  S[key].forEach(function(p,i){
    var r=document.createElement("div");r.className="it";
    var th=document.createElement("label");th.className="th";th.textContent=p.src?"":"📷";if(p.src)th.style.backgroundImage="url("+p.src+")";
    var fi=document.createElement("input");fi.type="file";fi.accept="image/*";
    fi.onchange=function(){if(fi.files[0])shrink(fi.files[0],function(d){p.src=d;save();render();buildList(key,boxId)})};
    th.appendChild(fi);
    var t=document.createElement("input");t.type="text";t.value=p.cap;t.oninput=function(){p.cap=t.value;save();render()};
    var x=document.createElement("button");x.textContent="✕";x.onclick=function(){S[key].splice(i,1);save();render();buildList(key,boxId)};
    r.appendChild(th);r.appendChild(t);r.appendChild(x);box.appendChild(r);
  });
}
function addItem(key){S[key].push({src:"",cap:key=="mem"?"Năm mới":"Tháng mới"});save();render();buildList(key,key=="mem"?"edMem":"edRec")}
$("eatIn").onchange=function(e){if(e.target.files[0])shrink(e.target.files[0],function(d){S.eatPhoto=d;save();render()})};
function togEd(){var p=$("ed");p.classList.toggle("open");if(p.classList.contains("open")){buildForm();buildList("mem","edMem");buildList("rec","edRec")}}
function resetAll(){if(confirm("Xoá toàn bộ chỉnh sửa và ảnh?")){try{localStorage.removeItem(KEY)}catch(e){}load();buildForm();buildList("mem","edMem");buildList("rec","edRec");render()}}
$("fontSel").onchange=function(){S.letterFont=this.value;save();applyFont()};
load();render();tick();
</script>
</body>
</html>
